name: NetGuard SOC Shadowed Time Helper Cleanup

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'release/public-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: release/public-hardening

      - name: Remove exact dead helper definition
        shell: python
        run: |
          from pathlib import Path
          path = Path('soc_ai/soc_server.py')
          text = path.read_text(encoding='utf-8')
          dead = '''def _ng_now_iso() -> str:
              return datetime.now().astimezone().isoformat(timespec="seconds")
          
          '''.replace('          ', '')
          if text.count(dead) == 1:
              path.write_text(text.replace(dead, '', 1), encoding='utf-8')
              print('Removed shadowed _ng_now_iso definition; later runtime implementation remains unchanged.')
          elif text.count(dead) == 0 and text.count('def _ng_now_iso():') == 1:
              print('Shadowed time helper already removed.')
          else:
              raise SystemExit(f'Time-helper assertion failed: dead={text.count(dead)}, live={text.count("def _ng_now_iso():")}')

      - name: Commit cleanup when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- soc_ai/soc_server.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soc_ai/soc_server.py
          git commit -m "fix: remove shadowed alert time helper"
          git push origin HEAD:release/public-hardening
