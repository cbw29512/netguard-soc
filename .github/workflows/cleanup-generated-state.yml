name: NetGuard SOC Generated State Cleanup

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'release/public-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: release/public-hardening

      - name: Remove exact generated/runtime paths
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch \
            soc/venv \
            sensors/lib/__pycache__ \
            soc/app/__pycache__ \
            soc_ai/__pycache__ \
            enterprise/influxdb/data
          git rm --ignore-unmatch \
            soc_ai/*.backup_* \
            soc_ai/static/css/*.backup_* \
            soc_ai/static/js/*.backup_* \
            soc_ai/templates/*.backup_* \
            static/*.backup_*

      - name: Commit cleanup only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No generated/runtime paths remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove remaining generated runtime state"
          git push origin HEAD:release/public-hardening
