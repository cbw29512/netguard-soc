name: NetGuard SOC History Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tree and history for recognizable credential formats
        shell: bash
        run: |
          set -euo pipefail
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|(AKIA|ASIA)[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,255}|github_pat_[A-Za-z0-9_]{50,255}|xox[baprs]-[A-Za-z0-9-]{20,}|sk-(proj-|ant-)?[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}'
          found=0

          tree_hits="$(git grep -I -l -E "$pattern" HEAD -- . || true)"
          sensitive_names="$(git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|credentials\.json|service-account\.json)$|\.(pem|p12|pfx)$' | grep -v -E '\.env\.example$|\.example\.(pem|key)$' || true)"

          if [[ -n "$tree_hits" ]]; then
            echo "Potential credential patterns exist in the current tree:"
            printf '%s\n' "$tree_hits"
            found=1
          fi

          if [[ -n "$sensitive_names" ]]; then
            echo "Sensitive filenames are tracked:"
            printf '%s\n' "$sensitive_names"
            found=1
          fi

          if git log -p --all --no-ext-diff --no-renames --pretty=format: | grep -E -q "$pattern"; then
            echo "Potential credential pattern exists in Git history. Rotate any real credential before history cleanup."
            found=1
          fi

          if [[ "$found" -ne 0 ]]; then
            exit 1
          fi

          echo "No recognized credential patterns or sensitive filenames found."
